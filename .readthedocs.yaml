# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Required: explicitly declare MkDocs (avoids "sphinx.configuration key is missing" error)
mkdocs:
  configuration: mkdocs.yml

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Install project with [docs] extra so MkDocs and mkdocs-material are available
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
